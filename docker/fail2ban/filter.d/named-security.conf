# Fail2ban filter for BIND9 / named security events
#
# Catches:
#  - Refused recursive queries (query cache denied)
#  - Refused zone transfers
#  - Bad/unauthorized RNDC requests

[Definition]

_daemon = named

failregex = ^%(__prefix_line)s\s*client(?:\s+@\w+)?\s+<HOST>#\d+\s+(?:\(\S+\)\s+)?:\s*(?:view\s+\S+:\s+)?query \(cache\) '.*' denied\s*$
            ^%(__prefix_line)s\s*client(?:\s+@\w+)?\s+<HOST>#\d+\s*:\s*(?:view\s+\S+:\s+)?(?:transfer of '.*': REFUSED|zone transfer '.*' denied)\s*$
            ^%(__prefix_line)s\s*client(?:\s+@\w+)?\s+<HOST>#\d+\s*:\s*request has invalid signature\s*$

ignoreregex =

# Log format example:
# 30-May-2026 10:15:23.456 security: client @0x7f1234567890 192.168.1.100#54321 (example.com): query (cache) 'example.com/ANY/IN' denied
